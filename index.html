<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Billing</title>
<meta name="theme-color" content="#7B1E1E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Gujarati:wght@400;500;600;700&family=Noto+Serif+Gujarati:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="app-header">
  <div class="brand">
    <div class="brand-mark" id="brandMark">S</div>
    <div class="brand-text">
      <h1 id="shopNameDisplay">Shree Sweet Mart</h1>
      <p id="shopMetaDisplay">Billing</p>
    </div>
  </div>

  <nav class="main-tabs" id="mainTabs" role="tablist">
    <button class="tab is-active" data-tab="bill" data-i18n="tabBill">New Bill</button>
    <button class="tab" data-tab="history" data-i18n="tabHistory">Bills</button>
    <button class="tab" data-tab="summary" data-i18n="tabSummary">Summary</button>
  </nav>

  <div class="header-actions">
    <button class="lang-toggle" id="langToggle" aria-label="Toggle language">ગુ</button>
    <span class="sync-dot" id="syncDot" title="Cloud status"></span>
    <button class="icon-btn" id="btnSettings" aria-label="Settings" title="Settings (S)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 8a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V2a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
      </svg>
    </button>
  </div>
</header>

<main class="app-shell">

  <!-- ══════ TAB: BILL ══════ -->
  <section class="tab-view" data-view="bill" data-active>
    <div class="bill-layout">
      <section class="catalog" aria-label="Item catalog">
        <div class="toolbar">
          <div class="search-wrap">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
            </svg>
            <input id="search" type="search" data-i18n-ph="searchItems" placeholder="Search item…" autocomplete="off" spellcheck="false">
            <button class="search-clear" id="searchClear" hidden aria-label="Clear">✕</button>
          </div>
          <div class="chips" id="catChips">
            <button class="chip is-active" data-cat="all"><span data-i18n="all">All</span> <span class="chip-count" data-count="all"></span></button>
            <button class="chip" data-cat="mithai"><span data-i18n="mithai">Mithai</span> <span class="chip-count" data-count="mithai"></span></button>
            <button class="chip" data-cat="farsan"><span data-i18n="farsan">Farsan</span> <span class="chip-count" data-count="farsan"></span></button>
            <button class="chip" data-cat="dryfruit"><span data-i18n="dryfruit">Dryfruit</span> <span class="chip-count" data-count="dryfruit"></span></button>
          </div>
        </div>
        <div class="item-grid" id="itemGrid"></div>
        <p class="empty-state" id="catalogEmpty" hidden data-i18n="noItems">No items found</p>
      </section>

      <aside class="cart" id="cart" aria-label="Current bill">
        <button class="cart-head" id="cartToggle" aria-expanded="false">
          <div class="cart-head-left">
            <h2 data-i18n="bill">Bill</h2>
            <span class="bill-no" id="billNoLabel">#—</span>
          </div>
          <div class="cart-head-right">
            <span class="cart-count" id="cartCount">0</span>
            <span class="cart-total-mini" id="cartTotalMini">₹0</span>
            <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m6 15 6-6 6 6"/></svg>
          </div>
        </button>
        <div class="cart-body">
          <div class="field-grid">
            <label class="field"><span data-i18n="customer">Customer</span><input id="custName" type="text" autocomplete="off"></label>
            <label class="field"><span data-i18n="phone">Phone</span><input id="custPhone" type="tel" inputmode="numeric" autocomplete="off" maxlength="10"></label>
          </div>
          <ul class="cart-lines" id="cartLines"></ul>
          <p class="cart-empty" id="cartEmpty"><span>🧾</span><span data-i18n="cartEmpty">Tap a weight on any item</span></p>
          <div class="totals" id="totals">
            <div class="tot-row"><span data-i18n="subtotal">Subtotal</span><b id="subtotalVal">₹0</b></div>
            <div class="tot-row discount-row"><span data-i18n="discount">Discount</span>
              <div class="discount-input"><input id="discount" type="number" min="0" step="1" value="0" inputmode="decimal"><span>₹</span></div>
            </div>
            <div class="tot-row grand"><span data-i18n="total">Total</span><b id="totalVal">₹0</b></div>
            <div class="tot-words" id="totalWords"></div>
          </div>
          <div class="pay-row">
            <span class="pay-label" data-i18n="payment">Payment</span>
            <div class="pay-pills" id="payPills">
              <button class="pill is-active" data-pay="Cash" data-i18n="cash">Cash</button>
              <button class="pill" data-pay="UPI" data-i18n="upi">UPI</button>
              <button class="pill" data-pay="Card" data-i18n="card">Card</button>
              <button class="pill" data-pay="Udhaar" data-i18n="credit">Credit</button>
            </div>
          </div>
        </div>
        <div class="cart-foot">
          <button class="btn btn-primary" id="btnSave" data-i18n="savePdf">Save + PDF</button>
          <button class="btn btn-ghost" id="btnPrint" title="Print">🖨</button>
          <button class="btn btn-ghost btn-danger-ghost" id="btnClear" title="Clear">✕</button>
        </div>
      </aside>
    </div>
  </section>

  <!-- ══════ TAB: HISTORY ══════ -->
  <section class="tab-view" data-view="history" hidden>
    <div class="history-view">
      <div class="view-head">
        <h2 data-i18n="historyTitle">Bills</h2>
        <button class="btn btn-outline btn-sm" id="btnSyncCloud" data-i18n="syncCloud">Sync from cloud</button>
      </div>
      <div class="history-toolbar">
        <div class="search-wrap">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
          </svg>
          <input id="historySearch" type="search" data-i18n-ph="historySearch" placeholder="Search…" autocomplete="off">
        </div>
        <div class="chips" id="historyChips">
          <button class="chip is-active" data-filter="all" data-i18n="filterAll">All</button>
          <button class="chip" data-filter="today" data-i18n="filterToday">Today</button>
          <button class="chip" data-filter="yesterday" data-i18n="filterYesterday">Yesterday</button>
          <button class="chip" data-filter="week" data-i18n="filterWeek">This Week</button>
          <button class="chip" data-filter="month" data-i18n="filterMonth">This Month</button>
        </div>
      </div>
      <p class="history-meta" id="historyMeta"></p>
      <div class="history-list" id="historyList"></div>
      <p class="empty-state" id="historyEmpty" hidden data-i18n="noBills">No bills found</p>
    </div>
  </section>

  <!-- ══════ TAB: SUMMARY ══════ -->
  <section class="tab-view" data-view="summary" hidden>
    <div class="summary-view">
      <div class="view-head">
        <h2 data-i18n="summaryTitle">Summary</h2>
      </div>
      <div class="summary-cards" id="summaryCards"></div>
      <div class="summary-panel">
        <h3 class="panel-title" data-i18n="monthlyBreakdown">Month by Month</h3>
        <div id="monthlyTable"></div>
      </div>
      <div class="summary-panel">
        <h3 class="panel-title" data-i18n="topCustomers">Top Customers</h3>
        <div id="topCustomers"></div>
      </div>
    </div>
  </section>
</main>

<!-- Settings modal -->
<div class="modal" id="settingsModal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-card" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h2 data-i18n="settings">Settings</h2>
      <button class="icon-btn" data-close aria-label="Close">✕</button>
    </div>
    <div class="modal-body">
      <h3 class="section-label" data-i18n="shopDetails">Shop details</h3>
      <label class="field"><span>Shop name (Gujarati)</span><input id="setShopGu"></label>
      <label class="field"><span>Shop name (English)</span><input id="setShopEn"></label>
      <label class="field"><span>Address</span><input id="setAddress"></label>
      <div class="field-grid">
        <label class="field"><span>Phone</span><input id="setPhone" inputmode="tel"></label>
        <label class="field"><span>GSTIN</span><input id="setGst"></label>
      </div>
      <label class="field"><span>Bill footer</span><input id="setFooter"></label>

      <h3 class="section-label" data-i18n="cloudBackup">GitHub cloud backup</h3>
      <div class="field-grid">
        <label class="field"><span>GitHub username</span><input id="setOwner"></label>
        <label class="field"><span>Repository</span><input id="setRepo"></label>
      </div>
      <label class="field"><span>Fine-grained token</span><input id="setToken" type="password" autocomplete="off"></label>
      <div class="settings-status" id="settingsStatus"></div>
      <button class="btn btn-outline btn-sm" id="btnTestCloud" data-i18n="testConnection">Test connection</button>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-close data-i18n="cancel">Cancel</button>
      <button class="btn btn-primary" id="btnSaveSettings" data-i18n="save">Save</button>
    </div>
  </div>
</div>

<div class="invoice-stage" aria-hidden="true"><div id="invoice" class="inv"></div></div>
<div class="toast-stack" id="toastStack" aria-live="polite"></div>

<script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script defer src="js/i18n.js"></script>
<script defer src="js/data.js"></script>
<script defer src="js/store.js"></script>
<script defer src="js/invoice.js"></script>
<script defer src="js/history.js"></script>
<script defer src="js/summary.js"></script>
<script defer src="js/app.js"></script>
</body>
</html>
